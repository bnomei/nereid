[package]
name = "nereid"
version = "0.9.0"
edition = "2021"
license-file = "LICENSE"
rust-version = "1.85"
description = "Source-available noncommercial terminal diagram TUI and MCP server for Mermaid-backed sessions"
readme = "README.md"
homepage = "https://github.com/bnomei/nereid"
repository = "https://github.com/bnomei/nereid"
documentation = "https://docs.rs/nereid"
keywords = ["mcp", "tui", "diagram", "mermaid", "ascii"]
categories = ["command-line-utilities", "development-tools"]
# Usage restrictions: source-available for noncommercial use only.
# Commercial or product use requires separate written permission; see LICENSE.
exclude = [".DS_Store", "specs/**"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.2.1"
fs2 = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
rmcp = { version = "1.8", features = ["transport-streamable-http-server"] }
tokio = { version = "1.52.3", features = ["io-std", "macros", "rt", "sync", "time"] }
regex = "1.13.0"
axum = "0.8.9"
base64 = "0.22.1"
rapidfuzz = "0.5"

[dev-dependencies]
criterion = { version = "4.7.0", package = "codspeed-criterion-compat" }
rstest = "0.26"

[[bench]]
name = "flow"
harness = false

[[bench]]
name = "seq"
harness = false

[[bench]]
name = "render"
harness = false

[[bench]]
name = "ops"
harness = false

[[bench]]
name = "store"
harness = false

[[bench]]
name = "scenario"
harness = false

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "load"
harness = false
